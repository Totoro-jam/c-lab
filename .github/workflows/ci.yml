name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libcurl4-openssl-dev

      - name: Build and test
        env:
          CC: ${{ matrix.cc }}
          SKIP_NETWORK: 1
        run: make test
